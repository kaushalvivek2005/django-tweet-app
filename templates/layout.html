{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <title>
        {% block title %}
        My Tweet App
        {% endblock %}
    </title>
</head>
<body class="bg-gray-700 text-white">
    <nav class="bg-gray-800 text-white px-6 py-3">
    <div class="flex items-center justify-between">

        <!-- Logo -->
        <a href="/" class="text-xl font-bold">
            Tweetbar
        </a>

        <!-- Links -->
        <div class="flex items-center gap-6">
            <a href="/" class="hover:text-gray-300">Home</a>
            <a href="#" class="hover:text-gray-300">Link</a>

            <a href="#" class="hover:text-gray-300">Dropdown</a>

            <a href="#" class="text-gray-500 cursor-not-allowed">
                Disabled
            </a>
            <a class="bg-blue-500" href="{%url 'tweet_list'%}">Tweet</a>
            {% if user.is_authenticated %}
            <form method="POST" action="{%url 'logout'%}">
                {% csrf_token %}
                <button class="bg-red-500" type="submit">Logout</button>
            </form>
            {% else %}
             <a class="bg-amber-500" href="{%url 'login'%}">Login</a>
              <a class="bg-blue-500" href="{%url 'register'%}">Register</a>
            {% endif %}
            
        </div>

        <!-- Search -->
        <div class="flex items-center gap-2">
            <input
                type="text"
                placeholder="Search"
                class="px-3 py-1.5 rounded bg-gray-700 text-white
                       border border-gray-600 focus:outline-none"
            >

            <button
                class="px-3 py-1.5 rounded border border-green-500
                       text-green-400 hover:bg-green-500 hover:text-white">
                Search
            </button>
        </div>

    </div>
</nav>
     <div class="container">
        {% block content %}
     
        {% endblock %}
     </div>
</body>
</html>
