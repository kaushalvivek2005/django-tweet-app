{% extends "layout.html" %}

{% block title %}
    Django Tweet
{% endblock %}

{% block content %}
    <h1 class="text-4xl text-center font-bold text-red-500">
        Are you sure you want to delete this tweet?
    </h1>
    <form method="post">
        {% csrf_token %}
        <button class="bg-red-600">Delete</button>
        <a class="bg-amber-500 " href="{% url 'tweet_list' %}"> Cancel</a>
    </form>
{% endblock %}
